# ==========================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================================
spring.application.name=easy-rag

# Chat (Ollama via API compatível com OpenAI)
app.ai.chat.base-url=http://127.0.0.1:11434/v1
app.ai.chat.api-key=ollama
app.ai.chat.model-name=llama3.2
app.ai.chat.temperature=0.0
app.ai.chat.timeout-seconds=300

# RAG Settings
app.ai.rag.max-results=3
app.ai.rag.min-score=0.5
app.ai.rag.chunk-size=500
app.ai.rag.chunk-overlap=50
